name: 發布主管預覽網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得網站檔案
        uses: actions/checkout@v6
      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 建立禁止搜尋的預覽版本
        run: node scripts/build-pages-preview.mjs
      - name: 上傳預覽網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-preview

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 發布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
